<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Convert Money</title>
  </head>
  <body>
    <img
      class="logo-inicial"
      src="./assets/img/Logotipo Money Verde com Seta de Crescimento.png"
      alt="logo-money"
    />
    <main>
      <label class="converte-de">
        converter <b>de</b>
        <select>
          <option>R$ Real brasileiro</option>
          <option>US$ Dólar Americano</option>
          <option>€ Euro</option>
          <option>£ Libra</option>
          <option>₿ Bitcoin</option>
        </select>
      </label>
      <label class="converter-para">
        converter <b>para</b>
        <select>
          <option>US$ Dólar Americano</option>
          <option>R$ Real brasileiro</option>
          <option>€ Euro</option>
          <option>£ Libra</option>
          <option>₿ Bitcoin</option>
        </select>
      </label>
      <label>
        Valor
        <input placeholder="R$ 10.000,00" />
      </label>
      <section>
        <button>Converter</button>
        <div>
          <img src="./assets/img/brasil 2.png " alt="logo-moeda-a-converter" />
          <p>Real</p>
          <p>R$ 0,00</p>
        </div>
        <img src="./assets/img/Vector.png" alt="seta" />
        <div>
          <img
            src="./assets/img/estados-unidos (1) 1.png"
            alt="logo-moeda-a-convertida"
          />
          <p>Dólar Americano</p>
          <p>US$ 0,00</p>
        </div>
      </section>
    </main>
  </body>
</html>
