<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Convert Money</title>
  </head>
  <body>
    <img
      class="logo-inicial"
      src="./assets/img/Logotipo Money Verde com Seta de Crescimento.png"
      alt="logo-money"
    />
    <main>
      <label class="converte-de">
        converter <b>de</b>
        <select class="primeira-md">
          <option value="BRL">R$ Real Brasileiro</option>
        </select>
      </label>

      <label class="converter-para">
        converter <b>para</b>
        <select class="segundo-md">
          <option value="USD">US$ Dólar Americano</option>
          <option value="EUR">€ Euro</option>
          <option value="GBP">£ Libra</option>
          <option value="BTC">₿ Bitcoin</option>
        </select>
      </label>

      <label>
        Valor
        <input class="input-valor" type="number" placeholder="R$ 10.000,00" />
      </label>
      <button class="convert-button">Converter</button>
      <section>
        <div class="box-moeda">
          <img src="./assets/img/brasil 2.png " alt="logo-moeda-a-converter" />
          <p class="moeda">Real</p>
          <p class="moeda-valor">R$ 0,00</p>
        </div>
        <img class="seta" src="./assets/img/Vector.png" alt="seta" />
        <div class="box-moeda">
          <img
            class="moeda-img"
            src="./assets/img/estados-unidos (1) 1.png"
            alt="logo-moeda-a-convertida"
          />
          <p class="moeda" id="moeda-name">Dólar Americano</p>
          <p class="moeda-valor-2">US$ 0,00</p>
        </div>
      </section>
    </main>
  </body>
  <script src="./app.js"></script>
</html>
