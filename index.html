<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Convert Money</title>
  </head>
  <body>
    <img
      src="./assets/img/Logotipo Money Verde com Seta de Crescimento.png"
      alt="logo-money"
    />
    <main>
      <label>
        converter <b>de</b>
        <select>
          <option>R$ Real brasileiro</option>
          <option>€ Euro</option>
          <option>£ Libra</option>
          <option>₿ Bitcoin</option>
        </select>
      </label>
      <label>
        converter <b>para</b>
        <select>
          <option>US$ Dólar Americano</option>
          <option>€ Euro</option>
          <option>£ Libra</option>
          <option>₿ Bitcoin</option>
        </select>
      </label>
      <section>
        <button>Converter</button>
        <div class="conversao"></div>
      </section>
    </main>
  </body>
</html>
